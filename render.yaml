# ----------------------------------------------------------------
# Render Blueprint — https://render.com/docs/blueprint-spec
#
# This is a plain static site: no build step, no server, no database.
# Render just serves the files in ./public from its CDN, on the free
# plan, and redeploys on every push to main.
#
# Deploy: Render Dashboard -> New + -> Blueprint -> pick this repo.
# ----------------------------------------------------------------

services:
  - type: web
    name: sivapandi-portfolio
    runtime: static
    branch: main
    autoDeploy: true

    # Nothing to compile — the site is hand-written HTML/CSS/JS.
    buildCommand: ""
    staticPublishPath: ./public

    routes:
      # /admin and /admin/ both open the content editor
      - type: rewrite
        source: /admin
        destination: /admin/index.html

    headers:
      # Content is edited by committing content.json, so it must never
      # be served stale after a deploy.
      - path: /content.json
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
