<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Panel | Sivapandi R Portfolio</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div class="login-screen" id="login-screen">
    <div class="login-card">
        <div class="login-brand">
            <span class="login-logo"><i class="fa-solid fa-shield-halved"></i></span>
            <h1>Portfolio Admin</h1>
            <p>Sign in to manage the Sivapandi R portfolio content.</p>
        </div>

        <form id="login-form" autocomplete="on">
            <div class="field">
                <label for="login-username">Username</label>
                <div class="input-icon">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="login-username" name="username" required autocomplete="username" placeholder="admin">
                </div>
            </div>
            <div class="field">
                <label for="login-password">Password</label>
                <div class="input-icon">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="••••••••">
                    <button type="button" class="reveal-pass" id="reveal-pass" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
                </div>
            </div>

            <div class="login-error" id="login-error"></div>

            <button type="submit" class="btn btn-primary btn-block" id="login-submit">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </form>

        <p class="login-foot">
            <a href="/"><i class="fa-solid fa-arrow-left"></i> Back to website</a>
        </p>
    </div>
</div>

<!-- ============ ADMIN APP ============ -->
<div class="admin-app" id="admin-app" hidden>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
            <span class="sidebar-logo"><i class="fa-solid fa-gauge-high"></i></span>
            <div>
                <strong>Portfolio CMS</strong>
                <small>Sivapandi R</small>
            </div>
            <button class="sidebar-close" id="sidebar-close" aria-label="Close menu"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <nav class="sidebar-nav" id="sidebar-nav">
            <p class="nav-group-title">Overview</p>
            <button class="nav-item active" data-view="dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</button>
            <button class="nav-item" data-view="messages"><i class="fa-solid fa-inbox"></i> Messages <span class="badge" id="unread-badge" hidden>0</span></button>

            <p class="nav-group-title">Page Content</p>
            <button class="nav-item" data-view="site"><i class="fa-solid fa-sliders"></i> Site &amp; Navigation</button>
            <button class="nav-item" data-view="hero"><i class="fa-solid fa-star"></i> Hero Section</button>
            <button class="nav-item" data-view="about"><i class="fa-solid fa-user"></i> About</button>
            <button class="nav-item" data-view="skills"><i class="fa-solid fa-code"></i> Skills</button>
            <button class="nav-item" data-view="experience"><i class="fa-solid fa-briefcase"></i> Experience</button>
            <button class="nav-item" data-view="projects"><i class="fa-solid fa-diagram-project"></i> Projects</button>
            <button class="nav-item" data-view="education"><i class="fa-solid fa-graduation-cap"></i> Education</button>
            <button class="nav-item" data-view="contact"><i class="fa-solid fa-envelope"></i> Contact</button>
            <button class="nav-item" data-view="footer"><i class="fa-solid fa-shoe-prints"></i> Footer</button>
            <button class="nav-item" data-view="resume"><i class="fa-solid fa-file-pdf"></i> Resume / PDF</button>

            <p class="nav-group-title">System</p>
            <button class="nav-item" data-view="media"><i class="fa-solid fa-images"></i> Media Library</button>
            <button class="nav-item" data-view="account"><i class="fa-solid fa-user-shield"></i> Account</button>
            <button class="nav-item" data-view="backup"><i class="fa-solid fa-database"></i> Backup &amp; Reset</button>
        </nav>

        <div class="sidebar-foot">
            <a href="/" target="_blank" rel="noopener" class="btn btn-outline btn-block btn-sm">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> View Website
            </a>
            <button class="btn btn-ghost btn-block btn-sm" id="logout-btn">
                <i class="fa-solid fa-power-off"></i> Sign Out
            </button>
        </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Main -->
    <div class="main">
        <header class="topbar">
            <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
            <div class="topbar-title">
                <h2 id="view-title">Dashboard</h2>
                <p id="view-subtitle">Live overview of your portfolio</p>
            </div>
            <div class="topbar-actions">
                <button class="icon-btn" id="preview-toggle" title="Toggle live preview"><i class="fa-solid fa-desktop"></i></button>
                <button class="icon-btn" id="admin-theme-toggle" title="Toggle dark / light">
                    <i class="fa-solid fa-moon icon-moon"></i>
                    <i class="fa-solid fa-sun icon-sun"></i>
                </button>
                <div class="who">
                    <span class="avatar" id="who-avatar">A</span>
                    <span id="who-name">admin</span>
                </div>
            </div>
        </header>

        <div class="content-wrap">
            <main class="view-host" id="view-host"><!-- views render here --></main>

            <aside class="preview-pane" id="preview-pane" hidden>
                <div class="preview-head">
                    <span><i class="fa-solid fa-desktop"></i> Live Preview</span>
                    <div>
                        <button class="icon-btn sm" id="preview-reload" title="Reload"><i class="fa-solid fa-rotate-right"></i></button>
                        <button class="icon-btn sm" id="preview-close" title="Close"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
                <iframe id="preview-frame" src="/" title="Website preview"></iframe>
            </aside>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="admin-toast" id="admin-toast"></div>

<!-- Confirm dialog -->
<div class="dialog-backdrop" id="confirm-dialog" hidden>
    <div class="dialog">
        <h3 id="confirm-title">Are you sure?</h3>
        <p id="confirm-text"></p>
        <div class="dialog-actions">
            <button class="btn btn-ghost" id="confirm-cancel">Cancel</button>
            <button class="btn btn-danger" id="confirm-ok">Confirm</button>
        </div>
    </div>
</div>

<script src="/admin/admin.js"></script>
</body>
</html>
