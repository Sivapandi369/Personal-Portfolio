<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Content Editor | Sivapandi R Portfolio</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ==================== LOGIN SCREEN ==================== -->
<div class="login-screen" id="login-screen">
    <div class="login-card">
        <div class="login-logo">
            <i class="fa-solid fa-pen-to-square"></i>
        </div>
        <h1>Admin Login</h1>
        <p class="login-subtitle">Content Editor · Sivapandi R Portfolio</p>

        <form id="login-form" autocomplete="off">
            <div class="field">
                <label for="login-username"><i class="fa-solid fa-user"></i> Username</label>
                <input type="text" id="login-username" placeholder="Enter username" required autocomplete="off">
            </div>
            <div class="field">
                <label for="login-password"><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="login-password" placeholder="Enter password" required autocomplete="off">
            </div>
            <div class="login-error" id="login-error" hidden>
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>Invalid username or password.</span>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="login-btn">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </form>

        <div class="login-foot">
            <a href="../index.html" target="_blank" rel="noopener">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> View Website
            </a>
        </div>
    </div>
</div>

<div class="admin-app" id="admin-app" hidden>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
            <span class="sidebar-logo"><i class="fa-solid fa-pen-to-square"></i></span>
            <div>
                <strong>Content Editor</strong>
                <small>Sivapandi R</small>
            </div>
            <button class="sidebar-close" id="sidebar-close" aria-label="Close menu"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- Filled from schemas.js by js/app.js -->
        <nav class="sidebar-nav" id="sidebar-nav"></nav>

        <div class="sidebar-foot">
            <a href="../index.html" target="_blank" rel="noopener" class="btn btn-outline btn-block btn-sm">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> View Website
            </a>
            <button class="btn btn-ghost btn-block btn-sm" id="logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Main -->
    <div class="main">
        <header class="topbar">
            <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
            <div class="topbar-title">
                <h2 id="view-title">Content Editor</h2>
                <p id="view-subtitle"></p>
            </div>
            <div class="topbar-actions">
                <button class="icon-btn" id="preview-toggle" title="Toggle live preview"><i class="fa-solid fa-desktop"></i></button>
                <button class="icon-btn" id="admin-theme-toggle" title="Toggle dark / light">
                    <i class="fa-solid fa-moon icon-moon"></i>
                    <i class="fa-solid fa-sun icon-sun"></i>
                </button>
            </div>
        </header>

        <!-- Shown whenever the working copy differs from the deployed content.json -->
        <div class="dirty-banner" id="dirty-banner" hidden>
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>You have changes that are not on the live website yet.</span>
            <button class="btn btn-primary btn-sm" id="publish-shortcut">
                <i class="fa-solid fa-cloud-arrow-up"></i> Publish
            </button>
        </div>

        <div class="content-wrap">
            <main class="view-host" id="view-host"></main>

            <aside class="preview-pane" id="preview-pane" hidden>
                <div class="preview-head">
                    <span><i class="fa-solid fa-desktop"></i> Live Preview</span>
                    <div>
                        <button class="icon-btn sm" id="preview-reload" title="Reload"><i class="fa-solid fa-rotate-right"></i></button>
                        <button class="icon-btn sm" id="preview-close" title="Close"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
                <iframe id="preview-frame" src="about:blank" title="Website preview"></iframe>
            </aside>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="admin-toast" id="admin-toast"></div>

<!-- Confirm dialog -->
<div class="dialog-backdrop" id="confirm-dialog" hidden>
    <div class="dialog">
        <h3 id="confirm-title">Are you sure?</h3>
        <p id="confirm-text"></p>
        <div class="dialog-actions">
            <button class="btn btn-ghost" id="confirm-cancel">Cancel</button>
            <button class="btn btn-danger" id="confirm-ok">Confirm</button>
        </div>
    </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
